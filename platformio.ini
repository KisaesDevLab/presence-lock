; Presence Lock - ESP32-S3 firmware
; Watches for an iPhone over BLE (resolved with its IRK), reports presence to
; Home Assistant over MQTT, and presses Win+L over USB when the phone leaves.

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    ; USB-OTG (TinyUSB) so the port can be a HID keyboard + CDC serial
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    knolleary/PubSubClient@2.8
